pack: career-ops
# Which tool serves which task. The agent receives this with the mission; the prompt and the Skill
# still decide first, and a doubt that neither settles is asked in `summary` (never chosen at random).
toolRoles:
  - id: search-offers
    task: Chercher des offres
    tool: career_script
    usage: 'command: "scan" (sans path ni args)'
    note: 'repli du Skill si un portail échoue (modes/scan.md) : son API, puis scan_query, puis skipped_error et on continue ; lis ses offres dans le navigateur et dis au Bilan quels portails ont échoué'
  - id: read-offer
    task: Lire une offre
    tool: browser_navigate
    then: [browser_snapshot]
    note: une page à la fois, attends sa capture avant d’ouvrir la suivante ; si la description manque, recapture avec scroll bottom ou waitForText, puis clique « plus » par sa ref et recapture
  - id: save-offer
    task: Enregistrer une offre
    tool: career_offer_save
    note: après lecture de l’offre
  - id: process-inbox
    task: Traiter la boîte d’entrée
    tool: career_read
    usage: 'path: "data/pipeline.md" (lignes « - [ ] » de la section Pending)'
    then: [career_script, career_write]
    note: 'suis modes/pipeline.md : balayage check-liveness, chaque « - [ ] » évaluée comme une annonce collée, puis cochée « - [x] » ou « - [!] » par career_write ; aucune ligne supprimée'
intents:
  - id: evaluate
    title: Évaluer une annonce
    priority: 90
    phrases:
      [
        évalue cette offre,
        evalue cette offre,
        évaluer une annonce,
        note cette offre,
        lis cette annonce,
        lis l'annonce,
        ouvre cette annonce,
        mode oferta,
      ]
    # Ordre du Skill (modes/auto-pipeline.md, modes/oferta.md « Post-evaluation », AGENTS.md
    # « TSV Format for Tracker Additions » et « Pipeline Integrity », DATA_CONTRACT.md) :
    # le résultat est le rapport et la ligne de suivi du Skill ; career_offer_save n'est qu'un index.
    # La vivacité suit la lecture comme dans auto-pipeline (Step 0 lecture, Step 0.5 vivacité) :
    # check-liveness confirme, avant toute écriture, ce que la page lue laisse voir.
    steps:
      - id: read-offer
        title: Lire réellement l'annonce
        tool: career_read
        alternativeTools: [browser_extract, browser_snapshot]
        argument: jds/
        precondition: Annonce identifiée
        done: Lecture d'une annonce enregistrée terminée
        optional: false
      - id: liveness
        title: Vérifier que l'annonce est encore ouverte
        tool: career_script
        argument: check-liveness
        precondition: URL de l'annonce connue et page lue (args [url])
        done: check-liveness terminé ; code 1 = expirée ou incertaine, alors ne pas évaluer et le dire au Bilan
        optional: false
        unlessPhrases:
          [
            annonce collée,
            texte collé,
            texte de l'annonce,
            sans url,
            sans lien,
            sans vérifier,
            sans check-liveness,
          ]
      - id: reserve
        title: Réserver le numéro du rapport
        tool: career_script
        argument: reserve-report-num
        precondition: Annonce lue et ouverte
        done: Numéro {###} rendu par reserve-report-num ; le libérer après écriture (args ["--release","{###}"])
        optional: false
        persists: true
      - id: report
        title: Écrire le rapport du Skill
        tool: career_write
        argument: reports/
        precondition: Numéro réservé, évaluation A–G faite selon modes/oferta.md
        done: reports/{###}-{company-slug}-{YYYY-MM-DD}.md avec **Score:** X.X/5, **URL:**, **Legitimacy:**, A–G, Machine Summary et annonce archivée (DATA_CONTRACT.md)
        optional: false
        persists: true
        readFirst: true
        proves: évaluation enregistrée
      # modes/oferta.md « Save report » : le numéro réservé est libéré une fois le rapport écrit
      # (E38). Constaté seulement : facultatif, la plateforme ne libère rien elle-même.
      - id: release
        title: Libérer le numéro du rapport
        tool: career_script
        argument: reserve-report-num
        args: ['--release', '{###}']
        precondition: Rapport reports/{###}-….md écrit
        done: reserve-report-num --release {###} terminé (args ["--release","{###}"]), reports/{###}-RESERVED.md retiré
        optional: true
        persists: true
      # auto-pipeline Step 3 : le CV adapté vient des scripts du Skill (modes/pdf.md), entre le rapport et le
      # suivi ; facultatif car le mode oferta n'a pas de PDF automatique. Payload JSON écrit sous output/.
      - id: cv-build
        title: Construire le HTML du CV adapté
        tool: career_script
        argument: build-cv-html
        precondition: Rapport écrit ; payload JSON de modes/pdf.md écrit par career_write output/cv-{candidate}-{###}-{company}.json ; modèle par cv-templates resolve cv
        done: build-cv-html terminé, code zéro, output/cv-{candidate}-{###}-{company}.html écrit (modes/pdf.md étape 18)
        optional: true
        persists: true
      - id: cv-verify
        title: Vérifier les faits du CV adapté
        tool: career_script
        argument: verify-cv-facts
        precondition: HTML construit (args [output/….html])
        done: verify-cv-facts code zéro ; non nul = fait absent du CV source, corriger le HTML (jamais cv.md) et relancer avant tout PDF (modes/pdf.md étape 19)
        optional: true
        persists: true
      - id: cv-pdf
        title: Produire le PDF du CV adapté
        tool: career_script
        argument: generate-pdf
        precondition: verify-cv-facts à zéro (args [html, output/cv-{candidate}-{###}-{company}-{date}.pdf, "--format=a4|letter", "--report={###}"])
        done: generate-pdf code zéro, data/pdf-index.tsv lié au rapport (modes/pdf.md étape 21) ; la ligne TSV porte alors pdf ✅
        optional: true
        persists: true
        proves: CV produit
      - id: tsv
        title: Écrire la ligne d'ajout au suivi
        tool: career_write
        argument: batch/tracker-additions/
        precondition: Rapport écrit
        done: batch/tracker-additions/{num}-{company-slug}.tsv, en-tête num date company role status score pdf report notes url puis une ligne, statut Evaluated, pdf ✅ si PDF produit sinon ❌ (AGENTS.md)
        optional: false
        persists: true
      - id: track
        title: Fusionner le suivi du Skill
        tool: career_script
        argument: merge-tracker
        precondition: TSV d'ajout écrit ; jamais d'écriture directe de data/applications.md
        done: merge-tracker terminé avec code zéro ; un état change ensuite par set-status
        optional: false
        persists: true
        proves: suivi écrit
      - id: save-evaluation
        title: Indexer l'offre dans Relay (facultatif)
        tool: career_offer_save
        precondition: Annonce lue
        done: Fiche relay/offers enregistrée, index secondaire du tableau Relay
        optional: true
        persists: true
        readFirst: true
        proves: évaluation enregistrée
  - id: search
    title: Chercher des offres
    priority: 100
    phrases: [trouve des offres, recherche des offres, cherche des offres, offres d'emploi]
    keywords: [offres, jobs, job, emploi]
    steps:
      - id: scan
        title: Scanner les portails du Skill
        tool: career_script
        argument: scan
        precondition: Portails configurés
        done: Script scan terminé avec code zéro
        optional: false
        required: true
        # E44 : un prompt qui donne une URL (page de résultats à lire) nomme lui-même la source ;
        # le scan des portails n'est plus exigé, il reste crédité s'il tourne.
        unlessUrl: true
        unlessPhrases:
          [
            sans scan,
            sans le scan,
            pas de scan,
            sans scanner,
            ne lance aucun script,
            sans lancer de script,
            ne lance rien,
            n'exécute rien,
          ]
      - id: save-offer
        title: Indexer les offres retenues dans Relay (facultatif)
        tool: career_offer_save
        precondition: Résultat de recherche disponible
        done: Fiche relay/offers enregistrée, index secondaire du tableau Relay
        optional: true
        readFirst: true
        persists: true
      - id: pipeline
        title: Ajouter les offres retenues à data/pipeline.md
        tool: career_write
        argument: data/pipeline.md
        precondition: Offres retenues hors scan (navigateur ; jobs_search_live si le prompt le demande)
        done: Éléments « - [ ] url | entreprise | poste » ajoutés à data/pipeline.md, par scan.mjs (scan réussi) ou par career_write (modes/pipeline.md)
        optional: true
        persists: true
  - id: pipeline
    title: Traiter la boîte d’entrée du Skill
    # Au-dessus de search (100) : « offres en attente » contient le mot-clé « offres » de search.
    priority: 110
    phrases:
      [
        traite la boîte d'entrée,
        traite la boite d'entree,
        boîte d'entrée,
        boite d'entree,
        offres en attente,
        travaille les offres en attente,
        traite les offres en attente,
        process the inbox,
        pending offers,
        pending urls,
        mode pipeline,
      ]
    keywords: [pipeline, inbox]
    # Ordre de modes/pipeline.md : balayage de vivacité avant toute URL (« Liveness sweep »), puis
    # pour chaque « - [ ] » survivante : extraction, numéro réservé, auto-pipeline (rapport, TSV,
    # merge-tracker), puis l'entrée passe de Pending à Processed. precheck-duplicate (brief) est
    # consultatif : le Skill ne le cite pas dans ce mode, sa déduplication se fait à merge-tracker.
    steps:
      - id: inbox
        title: Lire les entrées en attente de data/pipeline.md
        tool: career_read
        argument: data/pipeline.md
        precondition: Boîte d'entrée présente (sinon le dire au Bilan, rien à créer)
        done: Lignes « - [ ] url | entreprise | poste » de la section Pending relevées, le reste du fichier non relu (modes/pipeline.md « Find »)
        optional: false
      - id: sweep
        title: Balayer la vivacité des entrées en attente
        tool: career_script
        argument: check-liveness
        precondition: Au moins une URL en attente hors LinkedIn (args [url, …], 10 au plus par appel)
        done: Verdict par URL ; expirée = « - [x] ~~url | entreprise | poste~~ — posting expired (liveness sweep) » ; incertaine ou illisible reste « - [ ] »
        optional: false
        unlessPhrases: [sans vérifier, sans check-liveness, sans balayage, sans vivacité]
      - id: precheck
        title: Vérifier qu'une entrée n'est pas déjà suivie
        tool: career_script
        argument: precheck-duplicate
        precondition: Entrée vivante (args --company, --title, --url) ; consultatif, lecture seule
        done: precheck-duplicate terminé ; une correspondance forte se dit au Bilan et ne bloque pas (le Skill déduplique à merge-tracker)
        optional: true
      - id: read-offer
        title: Lire réellement l'annonce de chaque entrée
        tool: career_read
        alternativeTools: [browser_extract, browser_snapshot]
        argument: jds/
        precondition: Entrée vivante ; une page à la fois (navigateur partagé)
        done: 'Lecture terminée ; page inaccessible = « - [!] url — note », illisible = reste « - [ ] » avec « unreadable: code », jamais fermée sans preuve'
        optional: false
      - id: reserve
        title: Réserver le numéro du rapport
        tool: career_script
        argument: reserve-report-num
        precondition: Annonce lue et ouverte
        done: Numéro {###} rendu par reserve-report-num ; le libérer après écriture (args ["--release","{###}"])
        optional: false
        persists: true
        unlessPhrases: [sans écrire, à sec, sans rien écrire]
      - id: report
        title: Écrire le rapport du Skill
        tool: career_write
        argument: reports/
        precondition: Numéro réservé, évaluation A–G faite selon modes/oferta.md
        done: reports/{###}-{company-slug}-{YYYY-MM-DD}.md avec **Score:** X.X/5, **URL:**, **Legitimacy:**, A–G, Machine Summary et annonce archivée (DATA_CONTRACT.md)
        optional: false
        persists: true
        readFirst: true
        proves: évaluation enregistrée
        unlessPhrases: [sans écrire, à sec, sans rien écrire]
      - id: tsv
        title: Écrire la ligne d'ajout au suivi
        tool: career_write
        argument: batch/tracker-additions/
        precondition: Rapport écrit
        done: batch/tracker-additions/{num}-{company-slug}.tsv, en-tête num date company role status score pdf report notes url puis une ligne, statut Evaluated (AGENTS.md)
        optional: false
        persists: true
        unlessPhrases: [sans écrire, à sec, sans rien écrire]
      - id: track
        title: Fusionner le suivi du Skill
        tool: career_script
        argument: merge-tracker
        precondition: TSV d'ajout écrit ; jamais d'écriture directe de data/applications.md
        done: merge-tracker terminé avec code zéro ; un état change ensuite par set-status
        optional: false
        persists: true
        proves: suivi écrit
        unlessPhrases: [sans écrire, à sec, sans rien écrire]
      - id: mark
        title: Cocher l'entrée dans data/pipeline.md
        tool: career_write
        argument: data/pipeline.md
        precondition: Évaluation terminée (ou page inaccessible) ; fichier relu autour de la ligne
        done: 'Entrée passée en Processed « - [x] #NNN | url | entreprise | poste | X.X/5 | PDF ✅/❌ », ou « - [!] url — note » si inaccessible ; aucune ligne supprimée, seulement cochée'
        optional: false
        persists: true
        proves: boîte d’entrée traitée
        unlessPhrases: [sans écrire, à sec, sans rien écrire, sans cocher]
  - id: documents
    title: Préparer des documents
    priority: 70
    phrases:
      [
        rédige mon cv,
        redige mon cv,
        rédige une lettre,
        redige une lettre,
        prépare mon cv,
        prepare mon cv,
        adapte mon cv,
        cv adapté,
        cv + lettre,
        lettre de motivation,
        mode pdf,
        mode cover,
        génère le pdf,
      ]
    keywords: []
    # Chaîne du Skill (modes/pdf.md étapes 17b–21 et fin de mode, modes/cover.md étape 9) : le CV adapté et la
    # lettre viennent de ses scripts ; career_document reste une pièce jointe générique pour email_send, pas
    # la voie du CV. Aucune étape obligatoire : le Bilan dit ce qui a été produit.
    steps:
      - id: payload
        title: Écrire le payload JSON du CV adapté
        tool: career_write
        argument: output/
        precondition: cv.md, config/profile.yml et annonce lus (jds/{slug}.md écrite, jd-skill-gap) ; modes/pdf.md lu
        done: output/cv-{candidate}-{###}-{company}.json selon la table « JSON payload » de modes/pdf.md, faits tirés de cv.md seulement
        optional: false
        persists: true
        unlessPhrases:
          [lettre seule, seulement la lettre, uniquement la lettre, lettre uniquement, sans cv]
      - id: cv-structure
        title: Contrôler la structure du payload
        tool: career_script
        argument: verify-cv-structure
        precondition: Payload écrit (args [output/….json])
        done: verify-cv-structure terminé ; avertissement seulement, code 1 = payload illisible à corriger (modes/pdf.md étape 17b)
        optional: true
        persists: true
      - id: cv-build
        title: Construire le HTML du CV adapté
        tool: career_script
        argument: build-cv-html
        precondition: Payload écrit ; modèle donné par cv-templates resolve cv (args [payload.json, output/….html, template])
        done: build-cv-html code zéro, output/cv-{candidate}-{###}-{company}.html écrit (modes/pdf.md étape 18)
        optional: false
        persists: true
        unlessPhrases:
          [lettre seule, seulement la lettre, uniquement la lettre, lettre uniquement, sans cv]
      - id: cv-verify
        title: Vérifier les faits du CV adapté
        tool: career_script
        argument: verify-cv-facts
        precondition: HTML construit (args [output/….html])
        done: verify-cv-facts code zéro ; non nul = fait absent du CV source, corriger le HTML (jamais cv.md) et relancer avant tout PDF (modes/pdf.md étape 19)
        optional: false
        persists: true
        unlessPhrases:
          [lettre seule, seulement la lettre, uniquement la lettre, lettre uniquement, sans cv]
      - id: cv-pdf
        title: Produire le PDF du CV adapté
        tool: career_script
        argument: generate-pdf
        precondition: verify-cv-facts à zéro (args [html, output/cv-{candidate}-{###}-{company}-{date}.pdf, "--format=a4|letter", "--report={###}"])
        done: generate-pdf code zéro, PDF écrit et data/pdf-index.tsv lié au rapport (modes/pdf.md étape 21)
        optional: false
        persists: true
        proves: CV produit
        unlessPhrases:
          [lettre seule, seulement la lettre, uniquement la lettre, lettre uniquement, sans cv]
      - id: pdf-ready
        title: Marquer la colonne PDF du suivi
        tool: career_script
        argument: mark-pdf-ready
        precondition: PDF produit et ligne déjà dans data/applications.md (args ["{###}"], numéro du rapport)
        done: mark-pdf-ready code zéro, cellule PDF ✅ ; code 2 = aucune ligne pour ce rapport, le dire (modes/pdf.md, fin de mode)
        optional: true
        persists: true
      - id: cover
        title: Produire la lettre par le Skill
        tool: career_script
        argument: generate-cover-letter
        precondition: Payload de lettre écrit par career_write output/cover-payload-{company-slug}.json (modes/cover.md étape 9) ; modèle par cv-templates resolve cover
        done: generate-cover-letter code zéro (args ["--payload", "output/cover-payload-….json"]), output/{company-slug}-{role-slug}-cover.pdf écrit
        optional: true
        persists: true
        proves: lettre produite
  - id: apply
    title: Préparer une candidature
    priority: 60
    phrases: [postule, candidature, apply]
    keywords: [postuler]
    steps:
      - id: open
        title: Ouvrir le formulaire
        tool: browser_navigate
        urlPattern:
          words: [apply, application, candidature, postuler]
        precondition: Offre identifiée
        done: Navigation terminée
        optional: false
      - id: fill
        title: Préparer les champs
        tool: browser_fillForm
        precondition: Formulaire visible
        done: Champs remplis ; « Suivant » passe sans accord ; un dialogue de page se règle avec browser_dialog
        optional: false
      # apply-01 (E40) : le CV joint est le CV adapté de la chaîne du Skill (mode apply, étape 4b
      # TAILORED : build-cv-html → verify-cv-facts → generate-pdf), produit dans la mission ou déjà présent
      # (intent documents) ; career_documents et la réponse de generate-pdf en donnent le chemin.
      - id: cv-pdf
        title: Produire le PDF du CV adapté par la chaîne du Skill
        tool: career_script
        argument: generate-pdf
        precondition: Aucun cvTailored dans career_documents ; payload, build-cv-html et verify-cv-facts selon modes/pdf.md (args [html, output/….pdf, "--format=a4|letter", "--report={###}"])
        done: generate-pdf code zéro ; la réponse donne produced et cvTailored, chemins à passer tels quels à browser_upload
        optional: true
        persists: true
        proves: CV produit
      - id: upload
        title: Joindre le CV adapté de la mission
        tool: browser_upload
        precondition: Champ fichier visible ; path = cvTailored (réponse de generate-pdf ou career_documents) ; à défaut le CV du dossier (PDF rendu depuis cv.md), en le disant dans summary
        done: 'Fichier reçu par la page (uploaded) ; le Bilan dit « CV joint : adapté / brut / aucun »'
        optional: true
      - id: verify
        title: Relire les valeurs saisies
        tool: browser_verify
        precondition: Champs préparés
        done: Valeurs relues
        optional: true
      - id: review
        title: Relire avant soumission
        tool: browser_snapshot
        requiresStep: fill
        precondition: Champs préparés
        done: Instantané de relecture obtenu ; s’arrêter avant Envoyer sauf si le prompt demande l’envoi, la plateforme demande alors le clic au propriétaire
        optional: false
  - id: linkedin
    title: Préparer un brouillon LinkedIn
    priority: 50
    phrases: [linkedin, profil linkedin]
    keywords: [linkedin]
    steps:
      - id: draft
        title: Rédiger le brouillon LinkedIn
        tool: linkedin_draft
        precondition: Profil disponible
        done: Brouillon créé
        optional: false
