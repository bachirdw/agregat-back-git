id: career-ops
name: Candidatures — compatible career-ops
version: 0.1.0
description: Espace privé, CV et profil, recherche et évaluation avec l'agent choisi, brouillons et envois approuvés un par un.
keywords:
  [
    career-ops,
    trouve des offres,
    évalue cette offre,
    evalue cette offre,
    postule,
    candidature,
    cv joint,
    cv,
    profil,
    offres d'emploi,
    jobs,
    job,
    poste,
    postes,
    parcours,
  ]
skills: []
# Fichiers de la bibliothèque career-ops que le Skill décrit comme optionnels : absents tant que
# le Skill ne les a pas créés, ce n'est pas une erreur (DATA_CONTRACT.md, AGENTS.md amont).
optionalFiles: [data/blacklist.md, modes/_custom.md, data/applications.md]
workflow:
  id: career-agent
  title: Accompagner la recherche et les candidatures
  steps:
    - tool: career_read
      title: Lire le CV et le profil privés
    - tool: career_script
      title: Scanner les portails du Skill (command scan)
      arguments: { command: scan }
    - tool: jobs_search_live
      title: Recherche de secours (Arbeitnow, Remotive) si le scan du Skill échoue ou si le prompt la demande
    - tool: career_script
      title: Vérifier que l'offre est encore ouverte (command check-liveness), puis réserver le numéro du rapport (reserve-report-num)
    - tool: career_write
      title: Évaluer selon le Skill et écrire le rapport A–G reports/{###}-{company-slug}-{date}.md (note décimale X.X/5, H si la note ≥ 4,5), puis le TSV batch/tracker-additions/
    - tool: career_script
      title: Fusionner le suivi du Skill (command merge-tracker) ; un état change par set-status
      arguments: { command: merge-tracker }
    - tool: career_offer_save
      title: Indexer l'offre dans le tableau Relay (facultatif)
    - tool: email_send
      title: Préparer un envoi (aucun envoi sans accord)
policies:
  network:
    allowedHosts: [www.arbeitnow.com, remotive.com, www.gov.uk, assets.publishing.service.gov.uk]
  browser:
    capabilities:
      [
        browser.navigate,
        browser.snapshot,
        browser.extract,
        browser.click,
        browser.fillForm,
        browser.check,
        browser.select,
        browser.type,
        browser.press,
        browser.upload,
        browser.download,
        browser.dialog,
        browser.verify,
      ]
